services:
  mysql-testing:
    image: mysql:8.0
    restart: "no"
    ports:
      - "${LOOTRA_TEST_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${LOOTRA_TEST_DB_DATABASE:-lootra_testing}
      MYSQL_USER: ${LOOTRA_TEST_DB_USERNAME:-lootra_test}
      MYSQL_PASSWORD: ${LOOTRA_TEST_DB_PASSWORD:-lootra_test_password}
      MYSQL_ROOT_PASSWORD: ${LOOTRA_TEST_DB_ROOT_PASSWORD:-lootra_test_root_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - lootra_testing_mysql:/var/lib/mysql

volumes:
  lootra_testing_mysql:
